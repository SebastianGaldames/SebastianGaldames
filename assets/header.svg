.shot{stroke:#FFFFFF;stroke-width:2;fill:none;stroke-dasharray:260;stroke-dashoffset:260;animation:shoot 3.2s ease-out infinite}
.shot2{animation-delay:1.6s}
@keyframes shoot{0%{stroke-dashoffset:260;opacity:1}25%{stroke-dashoffset:0;opacity:1}45%{opacity:0}100%{stroke-dashoffset:0;opacity:0}}
.splat{fill:none;stroke:#FFFFFF;stroke-width:1.4;opacity:0;animation:splat 3.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
.splat2{animation-delay:1.6s}
@keyframes splat{0%,22%{opacity:0;transform:scale(.2)}28%{opacity:1;transform:scale(1)}45%,100%{opacity:0;transform:scale(1.1)}}
</style>
