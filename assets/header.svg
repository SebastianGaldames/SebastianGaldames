<style>
.bg{fill:#0D0D0D}
.web{stroke:#E62429;stroke-width:1.3;fill:none;opacity:.55}
.L{fill:#FFFFFF;animation:hop 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.L:nth-child(odd){fill:#FFFFFF}
.L0{animation-delay:0.00s;}.L1{animation-delay:0.12s;}.L2{animation-delay:0.24s;}.L3{animation-delay:0.36s;}.L4{animation-delay:0.48s;}.L5{animation-delay:0.60s;}.L6{animation-delay:0.72s;}.L7{animation-delay:0.84s;}.L8{animation-delay:0.96s;}.L9{animation-delay:1.08s;}.L10{animation-delay:1.20s;}.L11{animation-delay:1.32s;}.L12{animation-delay:1.44s;}.L13{animation-delay:1.56s;}.L14{animation-delay:1.68s;}.L15{animation-delay:1.80s;}.L16{animation-delay:1.92s;}
