<style>
  .web { stroke:#E62429; stroke-width:1.3; fill:none; opacity:.75; }
  .web line, .web path { stroke-dasharray:400; stroke-dashoffset:400; animation: draw 2.5s ease-out forwards; }
  .drop { animation: bob 3s ease-in-out infinite; }
  .legs { animation: wiggle .6s ease-in-out infinite alternate; transform-origin:0 0; }
  @keyframes draw { to { stroke-dashoffset:0; } }
  @keyframes bob { 0%,100% { transform: translate(450px,50px); } 50% { transform: translate(450px,115px); } }
  @keyframes wiggle { from { transform: rotate(-6deg); } to { transform: rotate(6deg); } }
  .d2 { animation: d2 4s ease-in-out infinite; }
  @keyframes d2 { 0%,100% { transform: translate(250px,30px); } 50% { transform: translate(250px,95px); } }
  .d3 { animation: d3 3.6s ease-in-out infinite; }
  @keyframes d3 { 0%,100% { transform: translate(650px,40px); } 50% { transform: translate(650px,105px); } }
  .d4 { animation: d4 5s ease-in-out infinite; }
  @keyframes d4 { 0%,100% { transform: translate(120px,20px); } 50% { transform: translate(120px,70px); } }
  .d5 { animation: d5 4.4s ease-in-out infinite; }
  @keyframes d5 { 0%,100% { transform: translate(780px,25px); } 50% { transform: translate(780px,80px); } }
</style>
